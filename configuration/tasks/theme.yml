title: Theme

actions:

  #
  - !registryValue:
    path: 'HKCU\Control Panel\Desktop'
    value: 'JPEGImportQuality'
    data: '100'
    type: REG_DWORD

  #
  - !powerShell:
    command: |
      # Source image path (must be inside the playbook's Images\ folder) - Ruta de la imagen (debe estar dentro de la carpeta Images\ del playbook)
      $src = 'images\wallpaper.jpg'

      if (!(Test-Path $src)) {
        Write-Warning "Fondo personalizado no encontrado en '$src'. Se salta esta parte."
        exit 0
      }

  #
      $ext = [IO.Path]::GetExtension($src)
      $dest = "$env:SystemRoot\Web\Wallpaper\IlyOs\ilyos$ext"
      New-Item -ItemType Directory -Force -Path (Split-Path $dest) -EA 0 | Out-Null
      Copy-Item -LiteralPath $src -Destination $dest -Force

  #
      reg add 'HKCU\Control Panel\Desktop' /v Wallpaper /t REG_SZ /d "$dest" /f
      reg add 'HKCU\Control Panel\Desktop' /v WallpaperStyle /t REG_SZ /d 10 /f
      reg add 'HKCU\Control Panel\Desktop' /v TileWallpaper /t REG_SZ /d 0 /f

  #
      $def = '[DllImport("user32.dll", SetLastError=true, CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(uint uAction, uint uParam, string lpvParam, uint fuWinIni);'
      Add-Type -Namespace Win32 -Name NativeMethods -MemberDefinition $def -EA 0
      [Win32.NativeMethods]::SystemParametersInfo(0x0015, 0, $dest, 0x03)

    wait: true
    exeDir: true
    runas: currentUserElevated
